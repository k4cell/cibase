<!-- ==============================================================================
     TOAST FLUTUANTE -- fica na raiz porque precisa aparecer em qualquer tela,
     inclusive no login, antes de existir sessão.
     ============================================================================== -->
<div *ngIf="toast.visivel" class="tx-toast" [ngStyle]="{'border-left-color': toast.cor}">
  <span class="tx-toast-icon" [ngStyle]="{'color': toast.cor}">
    <svg *ngIf="toast.cor === '#28a745'" class="tx-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="m9 12 2 2 4-4"></path>
    </svg>
    <svg *ngIf="toast.cor !== '#28a745'" class="tx-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path>
      <path d="M12 9v4"></path>
      <path d="M12 17h.01"></path>
    </svg>
  </span>
  <span class="tx-toast-message">{{ toast.mensagem }}</span>
  <button class="tx-toast-close" (click)="toast.fechar()" title="Fechar" aria-label="Fechar aviso">
    <svg class="tx-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 6 6 18"></path>
      <path d="m6 6 12 12"></path>
    </svg>
  </button>
</div>

<!-- ==============================================================================
     AVISO DE CONEXÃO LENTA -- aparece quando um request ao backend demora
     mais que o normal (ex: Render "acordando" depois de hibernar).
     ============================================================================== -->
<div *ngIf="conexao.mostrarAviso" class="tx-conexao-aviso">
  <span class="tx-spinner"></span>
  Conectando ao servidor... pode levar até 1 minuto na primeira vez depois de um tempo parado.
</div>

<router-outlet></router-outlet>
